[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-engine"
version = "0.3.0"
description = "Product-neutral media processing and artifact platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=25.1.0,<26",
  "alembic>=1.19.1,<2",
  "asyncpg>=0.31,<1",
  "boto3>=1.43.72,<2",
  "cryptography>=50.0.0,<51",
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28.1,<1.0",
  "openai>=3.1.0,<4",
  "pydantic>=2.13.4,<3.0",
  "pydantic-settings>=2.15.0,<3.0",
  "python-multipart>=0.0.32,<1.0",
  "sqlalchemy>=2.0.52,<3",
  "uvicorn[standard]>=0.52.3,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.10.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.3,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
