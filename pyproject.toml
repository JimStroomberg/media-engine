[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-engine"
version = "0.2.2"
description = "Product-neutral media processing and artifact platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiofiles>=25.1.0,<26",
  "alembic>=1.18.5,<2",
  "asyncpg>=0.31,<1",
  "boto3>=1.43.59,<2",
  "cryptography>=49.0,<50",
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28.1,<1.0",
  "openai>=2.50.0,<3",
  "pydantic>=2.13.4,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "python-multipart>=0.0.32,<1.0",
  "sqlalchemy>=2.0.51,<3",
  "uvicorn[standard]>=0.52.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.9.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.16.0,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
