name: media-engine

x-platform-image: &platform-image
  image: ${MEDIA_ENGINE_IMAGE:-jimstro/media-engine:latest}
  pull_policy: always

x-s3-environment: &s3-environment
  MEDIA_ENGINE_S3_ENDPOINT_URL: http://minio:9000
  MEDIA_ENGINE_S3_PUBLIC_ENDPOINT_URL: ${MEDIA_ENGINE_S3_PUBLIC_ENDPOINT_URL:?Set MEDIA_ENGINE_S3_PUBLIC_ENDPOINT_URL}
  MEDIA_ENGINE_S3_WORKER_ENDPOINT_URL: ${MEDIA_ENGINE_S3_WORKER_ENDPOINT_URL:-http://minio:9000}
  MEDIA_ENGINE_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-media-engine}
  MEDIA_ENGINE_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MEDIA_ENGINE_S3_BUCKET: ${MEDIA_ENGINE_S3_BUCKET:-media-engine}
  MEDIA_ENGINE_S3_REGION: ${MEDIA_ENGINE_S3_REGION:-us-east-1}
  MEDIA_ENGINE_S3_FORCE_PATH_STYLE: "true"

x-platform-environment: &platform-environment
  <<: *s3-environment
  MEDIA_ENGINE_DATABASE_URL: postgresql+asyncpg://media_engine:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/media_engine
  MEDIA_ENGINE_ASSET_RETENTION_HOURS: ${MEDIA_ENGINE_ASSET_RETENTION_HOURS:-24}
  MEDIA_ENGINE_PIPELINE_RETENTION_HOURS: ${MEDIA_ENGINE_PIPELINE_RETENTION_HOURS:-24}
  MEDIA_ENGINE_RETENTION_INTERVAL_SECONDS: ${MEDIA_ENGINE_RETENTION_INTERVAL_SECONDS:-60}
  MEDIA_ENGINE_WORKER_LEASE_SECONDS: ${MEDIA_ENGINE_WORKER_LEASE_SECONDS:-90}
  MEDIA_ENGINE_TRANSCODE_REQUIRED_BACKEND: rkmpp

services:
  postgres:
    image: postgres:18.4-alpine
    pull_policy: always
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: media_engine
      POSTGRES_USER: media_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_engine -d media_engine"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    pull_policy: always
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-media-engine}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9091}:9001"

  minio-init:
    <<: *platform-image
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment: *s3-environment
    command: ["python", "-m", "app.s3_init"]

  migrate:
    <<: *platform-image
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: *platform-environment
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *platform-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *platform-environment
      MEDIA_ENGINE_SELF_TEST_ON_STARTUP: "true"
      MEDIA_ENGINE_INPUT_DIR: /data/input
      MEDIA_ENGINE_WORK_DIR: /data/work
      MEDIA_ENGINE_OUTPUT_DIR: /data/output
      MEDIA_ENGINE_TEMP_DIR: /tmp/media-engine
      MEDIA_ENGINE_ADMIN_USERNAME: ${MEDIA_ENGINE_ADMIN_USERNAME:?Set MEDIA_ENGINE_ADMIN_USERNAME}
      MEDIA_ENGINE_ADMIN_PASSWORD: ${MEDIA_ENGINE_ADMIN_PASSWORD:?Set MEDIA_ENGINE_ADMIN_PASSWORD}
      MEDIA_ENGINE_ADMIN_SESSION_SECRET: ${MEDIA_ENGINE_ADMIN_SESSION_SECRET:?Set MEDIA_ENGINE_ADMIN_SESSION_SECRET}
      MEDIA_ENGINE_ADMIN_SESSION_COOKIE_SECURE: ${MEDIA_ENGINE_ADMIN_SESSION_COOKIE_SECURE:-false}
      MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY: ${MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY:?Set MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY}
      MEDIA_ENGINE_WORKER_ADVERTISED_API_URL: ${MEDIA_ENGINE_WORKER_ADVERTISED_API_URL:-}
      MEDIA_ENGINE_INITIAL_WORKER_TOKEN: ${MEDIA_ENGINE_LOCAL_WORKER_TOKEN:?Set MEDIA_ENGINE_LOCAL_WORKER_TOKEN}
      MEDIA_ENGINE_INITIAL_WORKER_KEY: ${MEDIA_ENGINE_RK1_WORKER_KEY:-worker-rk1-1}
      MEDIA_ENGINE_INITIAL_WORKER_DISPLAY_NAME: ${MEDIA_ENGINE_RK1_WORKER_DISPLAY_NAME:-Rockchip RK1 worker}
      MEDIA_ENGINE_INITIAL_WORKER_PROFILE: rk1
      MEDIA_ENGINE_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: ${MEDIA_ENGINE_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
    volumes:
      - ./data:/data
      - media-scratch:/tmp/media-engine
    ports:
      - "${MEDIA_ENGINE_PORT:-8095}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  scheduler:
    <<: *platform-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment: *platform-environment
    command: ["python", "-m", "app.maintenance"]

  webhook-dispatcher:
    <<: *platform-image
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MEDIA_ENGINE_DATABASE_URL: postgresql+asyncpg://media_engine:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/media_engine
      MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY: ${MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY:?Set MEDIA_ENGINE_CREDENTIAL_ENCRYPTION_KEY}
      MEDIA_ENGINE_WEBHOOK_DISPATCH_INTERVAL_SECONDS: ${MEDIA_ENGINE_WEBHOOK_DISPATCH_INTERVAL_SECONDS:-1}
      MEDIA_ENGINE_WEBHOOK_TIMEOUT_SECONDS: ${MEDIA_ENGINE_WEBHOOK_TIMEOUT_SECONDS:-10}
      MEDIA_ENGINE_WEBHOOK_MAX_ATTEMPTS: ${MEDIA_ENGINE_WEBHOOK_MAX_ATTEMPTS:-8}
      MEDIA_ENGINE_WEBHOOK_INITIAL_BACKOFF_SECONDS: ${MEDIA_ENGINE_WEBHOOK_INITIAL_BACKOFF_SECONDS:-10}
      MEDIA_ENGINE_WEBHOOK_MAX_BACKOFF_SECONDS: ${MEDIA_ENGINE_WEBHOOK_MAX_BACKOFF_SECONDS:-3600}
      MEDIA_ENGINE_WEBHOOK_LEASE_SECONDS: ${MEDIA_ENGINE_WEBHOOK_LEASE_SECONDS:-60}
      MEDIA_ENGINE_WEBHOOK_ALLOW_PRIVATE_ADDRESSES: ${MEDIA_ENGINE_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:-false}
    command: ["python", "-m", "app.webhook_dispatcher"]

  worker-rk1:
    image: ${MEDIA_ENGINE_RK1_IMAGE:-jimstro/media-engine:rk1-latest}
    pull_policy: always
    restart: unless-stopped
    privileged: true
    depends_on:
      api:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      MEDIA_ENGINE_WORKER_API_URL: http://api:8080
      MEDIA_ENGINE_WORKER_TOKEN: ${MEDIA_ENGINE_LOCAL_WORKER_TOKEN:?Set MEDIA_ENGINE_LOCAL_WORKER_TOKEN}
      MEDIA_ENGINE_WORKER_BACKEND: rkmpp
      MEDIA_ENGINE_WORKER_PROFILE: rk1
      MEDIA_ENGINE_WORKER_HEARTBEAT_SECONDS: ${MEDIA_ENGINE_WORKER_HEARTBEAT_SECONDS:-20}
      MEDIA_ENGINE_WORKER_POLL_SECONDS: ${MEDIA_ENGINE_WORKER_POLL_SECONDS:-2}
      MEDIA_ENGINE_SELF_TEST_ON_STARTUP: "true"
      MEDIA_ENGINE_REQUIRE_RK_ACCEL: "true"
      MEDIA_ENGINE_ALLOW_CPU_FALLBACK: "false"
      MEDIA_ENGINE_INPUT_DIR: /worker/input
      MEDIA_ENGINE_WORK_DIR: /worker/work
      MEDIA_ENGINE_OUTPUT_DIR: /worker/output
      MEDIA_ENGINE_TEMP_DIR: /worker/temp
    volumes:
      - worker-rk1-scratch:/worker
      - /usr/lib/aarch64-linux-gnu/dri:/usr/lib/aarch64-linux-gnu/dri:ro
      - /usr/lib/aarch64-linux-gnu/rga:/usr/lib/aarch64-linux-gnu/rga:ro
      - /usr/lib/aarch64-linux-gnu/mpp:/usr/lib/aarch64-linux-gnu/mpp:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    device_cgroup_rules:
      - "c 199:* rmw"
      - "c 29:* rmw"
      - "c 226:* rmw"
      - "c 240:* rmw"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    command: ["python", "-m", "app.worker"]

volumes:
  postgres-data:
  minio-data:
  media-scratch:
  worker-rk1-scratch:
