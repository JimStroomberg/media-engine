name: media-engine-worker-rk1

services:
  worker:
    image: ${MEDIA_ENGINE_WORKER_IMAGE:-jimstro/media-engine:rk1-0.3.0}
    pull_policy: ${MEDIA_ENGINE_WORKER_PULL_POLICY:-always}
    restart: unless-stopped
    init: true
    privileged: true
    environment:
      MEDIA_ENGINE_WORKER_API_URL: ${MEDIA_ENGINE_WORKER_API_URL:?Set the HTTPS control-plane URL}
      MEDIA_ENGINE_WORKER_TOKEN: ${MEDIA_ENGINE_WORKER_TOKEN:?Create a worker in the dashboard and paste its token}
      MEDIA_ENGINE_WORKER_BACKEND: rkmpp
      MEDIA_ENGINE_WORKER_PROFILE: ${MEDIA_ENGINE_WORKER_PROFILE:-rk1}
      MEDIA_ENGINE_WORKER_HEARTBEAT_SECONDS: ${MEDIA_ENGINE_WORKER_HEARTBEAT_SECONDS:-20}
      MEDIA_ENGINE_WORKER_POLL_SECONDS: ${MEDIA_ENGINE_WORKER_POLL_SECONDS:-2}
      MEDIA_ENGINE_SELF_TEST_ON_STARTUP: "true"
      MEDIA_ENGINE_REQUIRE_RK_ACCEL: "true"
      MEDIA_ENGINE_ALLOW_CPU_FALLBACK: "false"
      MEDIA_ENGINE_INPUT_DIR: /worker/input
      MEDIA_ENGINE_WORK_DIR: /worker/work
      MEDIA_ENGINE_OUTPUT_DIR: /worker/output
      MEDIA_ENGINE_TEMP_DIR: /worker/temp
    volumes:
      - worker-scratch:/worker
      - /usr/lib/aarch64-linux-gnu/dri:/usr/lib/aarch64-linux-gnu/dri:ro
      - /usr/lib/aarch64-linux-gnu/rga:/usr/lib/aarch64-linux-gnu/rga:ro
      - /usr/lib/aarch64-linux-gnu/mpp:/usr/lib/aarch64-linux-gnu/mpp:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dma_heap:/dev/dma_heap
    device_cgroup_rules:
      - "c 199:* rmw"
      - "c 29:* rmw"
      - "c 226:* rmw"
      - "c 240:* rmw"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
      - SYS_RAWIO
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 2m

volumes:
  worker-scratch:
