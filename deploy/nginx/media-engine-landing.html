<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Media Engine is a self-hosted media-processing backend for applications and AI agents.">
  <title>Media Engine</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e8edf8;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main {
      width: min(38rem, 100%);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid #28324c;
      border-radius: 1.25rem;
      background: #11182b;
      box-shadow: 0 1.5rem 4rem #0005;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2.25rem, 9vw, 4.5rem);
      line-height: .95;
      letter-spacing: -.06em;
    }
    p {
      max-width: 32rem;
      margin: 0;
      color: #b7c2d9;
      font-size: 1.05rem;
      line-height: 1.65;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-top: 2rem;
    }
    a {
      padding: .75rem 1rem;
      border: 1px solid #405075;
      border-radius: .65rem;
      color: #f3f6fc;
      text-decoration: none;
      font-weight: 650;
    }
    a:hover, a:focus-visible {
      border-color: #7aa2ff;
      background: #192440;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Media Engine</h1>
    <p>A self-hosted media-processing backend for applications and AI agents.</p>
    <nav aria-label="Project links">
      <a href="/docs">API documentation</a>
      <a href="https://github.com/JimStroomberg/media-engine" rel="noopener noreferrer">GitHub project</a>
    </nav>
  </main>
</body>
</html>
